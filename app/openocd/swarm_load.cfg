# 蜂群信道模拟器固件恢复 v3 —— PCAP 通道灌 PL（等效 xsct fpga / U-Boot zynq_load）
# 用法: openocd -s <scripts> -f swarm_ft2232.cfg -f target/zynq_7000.cfg -f ps7_shim.tcl -f swarm_load.cfg
# 环境变量: SWARM_BIT(未用,直接用转换好的 PCAP bin) / SWARM_INIT / SWARM_ELF / SWARM_PCAPBIN
# 2026-10-28 v3 要点：
#   ① PL 不再用 virtex2 JTAG 驱动（CCLK 启动的 bit 拉不起来，且死 PL 会挂死 AXI 总线）
#   ② 改用 DEVCFG PCAP：bin 灌入 DDR → DMA → PCAP → PCFG_DONE（U-Boot zynqpl.c 同款序列）
#   ③ 开头先 PS 软复位，清除上次实验的一切残留（含挂死的总线事务）
#   ④ 保留 v2 的全部垫片修复（mask_poll 覆盖/全局变量导出/DDR 完成位宽容）
# 路径解析：优先用 server.py 传入的环境变量；未传时回退到"相对本 cfg 所在目录"，
# 目的是让项目整体搬到任何机器/盘符都能直接用（原先写死作者本机的绝对路径）。
#   app/openocd/swarm_load.cfg  ->  ../ready/{ps7_init.tcl,swarm_app.elf}
#                                   ./system_wrapper_pcap.bin
set HERE  [file dirname [file normalize [info script]]]
set APP   [file normalize [file join $HERE ..]]
set INIT  [expr {[info exists ::env(SWARM_INIT)]    ? $::env(SWARM_INIT)    : [file join $APP ready ps7_init.tcl]}]
set ELF   [expr {[info exists ::env(SWARM_ELF)]     ? $::env(SWARM_ELF)     : [file join $APP ready swarm_app.elf]}]
set PBIN  [expr {[info exists ::env(SWARM_PCAPBIN)] ? $::env(SWARM_PCAPBIN) : [file join $APP ready system_wrapper_pcap.bin]}]
set DDRBIN 0x01000000
set D 0xF8007000

proc rd {a} { return [expr {[read32 $a] & 0xffffffff}] }
proc wr {a v} { mww $a $v }
proc poll_bit {a m want {n 2000}} {
    for {set i 0} {$i < $n} {incr i} {
        set v [expr {[rd $a] & $m}]
        if {$want == 0 ? ($v == 0) : ($v != 0)} { return 1 }
        sleep 1
    }
    return 0
}

proc swarm_program {} {
    global INIT ELF PBIN DDRBIN D
    init
    # ── A. PS 软复位（无需 halt；清除挂死的 AXI 事务与全部残留状态）──
    targets zynq.cpu1
    echo "SWARM: PS soft reset"
    catch { wr 0xF8000008 0x0000DF0D }
    catch { wr 0xF8000200 0x00000001 }
    sleep 2000
    catch { jtag arp_init }
    sleep 500
    # ── B. halt + ps7_init ──
    targets zynq.cpu0
    echo "SWARM: halting cpu0"
    halt 5000
    source $INIT
    proc mask_poll {addr mask} {
        for {set i 0} {$i < 300} {incr i} {
            if {[expr {[read32 $addr] & $mask}] == $mask} { return }
            sleep 10
        }
        set cur [expr {[read32 $addr] & 0xffffffff}]
        if {[string toupper $addr] eq "0XF8006054"} {
            echo [format "  警告: DDR 完成位 poll 超时 (%s=0x%08x, want 0x%08x)；DDR 读写已实测正常，继续" $addr $cur $mask]
            return
        }
        error [format "mask_poll timeout at %s mask 0x%08x last=0x%08x" $addr $mask $cur]
    }
    proc mask_delay {addr val} { sleep $val }
    proc ps_version { } { return [format "0x%x" [expr {[read32 0xF8007080] >> 28}]] }
    proc configparams {args} { return 1 }
    set ::PCW_SILICON_VER_1_0 $PCW_SILICON_VER_1_0
    set ::PCW_SILICON_VER_2_0 $PCW_SILICON_VER_2_0
    set ::PCW_SILICON_VER_3_0 $PCW_SILICON_VER_3_0
    set ::APU_FREQ $APU_FREQ
    ps7_init
    # ── C. 灌比特流到 DDR ──
    adapter speed 6000
    echo "SWARM: loading pcap bin to DDR"
    load_image $PBIN $DDRBIN bin
    set words [expr {[file size $PBIN] / 4}]
    echo "SWARM: bitstream in DDR, $words words"
    # ── D. PCAP 序列（U-Boot zynq_load 等效）──
    # D1. SLCR: 解锁 + devcfg_disable（断 FPGA 复位 + 电平转换 0xA）
    wr 0xF8000008 0x0000DF0D
    wr 0xF8000240 0x0000000F
    wr 0xF8000900 0x0000000A
    # D2. mctrl: 清 loopback
    set mc [rd [expr {$D + 0x80}]]
    wr [expr {$D + 0x80}] [expr {$mc & ~0x10}]
    # D3. PCFG_PROG_B 脉冲
    set ctrl [rd $D]
    wr $D [expr {$ctrl | 0x40000000}]
    wr $D [expr {$ctrl & ~0x40000000}]
    if {![poll_bit [expr {$D + 0x14}] 0x10 0]} { error "PCFG_INIT 未清零" }
    wr $D [expr {$ctrl | 0x40000000}]
    if {![poll_bit [expr {$D + 0x14}] 0x10 1]} { error "PCFG_INIT 未置位" }
    # D4. int_sts 读出并清零，查致命错误
    set isr [rd [expr {$D + 0x0C}]]
    wr [expr {$D + 0x0C}] 0xFFFFFFFF
    if {[expr {$isr & 0x00740040}] != 0} { error [format "PCAP 致命错误 isr=0x%08x" $isr] }
    # D5. status 检查（DMA 队列满？）
    set st [rd [expr {$D + 0x14}]]
    if {[expr {$st & 0x80000000}] != 0} { error "DEVCFG busy" }
    if {[expr {$st & 0x30000000}] != 0} { wr [expr {$D + 0x14}] 0x30000000 }
    # D6. DMA → PCAP
    echo "SWARM: PCAP DMA transfer"
    wr [expr {$D + 0x18}] [expr {$DDRBIN | 1}]
    wr [expr {$D + 0x1C}] 0xFFFFFFFF
    wr [expr {$D + 0x20}] $words
    wr [expr {$D + 0x24}] 0
    set ok 0
    for {set i 0} {$i < 3000} {incr i} {
        set isr [rd [expr {$D + 0x0C}]]
        if {[expr {$isr & 0x00340840}] != 0} { error [format "DMA 错误 isr=0x%08x" $isr] }
        if {[expr {$isr & 0x00002000}] != 0} { set ok 1; break }
        sleep 2
    }
    if {!$ok} { error "DMA 完成超时" }
    wr [expr {$D + 0x0C}] 0x00002000
    # D7. 等 PCFG_DONE
    if {![poll_bit [expr {$D + 0x0C}] 0x00000004 1 500]} { error "PCFG_DONE 等待超时" }
    echo "SWARM: PL config DONE"
    # D8. devcfg_enable（放 FPGA 复位 + 电平转换 0xF）
    wr 0xF8000240 0x00000000
    wr 0xF8000900 0x0000000F
    # ── E. ELF + 运行 ──
    echo "SWARM: ps7_post_config"
    ps7_post_config
    set source_file [open [file join $::APP sw main.c] r]
    set source_text [read $source_file]
    close $source_file
    if {![regexp {#define VERSION (0x[0-9a-fA-F]+)U} $source_text ignored expected_version]} {error "Missing firmware version contract"}
    set pl_version [rd 0x43C0003C]
    if {$pl_version != $expected_version} {error "FPGA version mismatch: read $pl_version, expected $expected_version"}
    echo [format "PL_VERSION_READBACK: %08x" $pl_version]
    echo "SWARM: loading elf $ELF"
    load_image $ELF
    reg pc 0x00100000
    echo "SWARM: resume"
    resume
    sleep 2000
    echo "PROGRAM_RUN_FINISHED"
    shutdown
}

if {[catch {swarm_program} reason]} {
    echo "PROGRAM_FAILED: $reason"
    catch {shutdown}
    exit 1
}
exit 0

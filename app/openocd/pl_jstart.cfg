# 测试：virtex2 pld load 后手动补 JSTART，看 PL 能否启动（读 0x43C0003C 版本寄存器）
set BIT "D:/Swarm_20261023_step29/app/ready/system_wrapper.bit"
set INIT "D:/Swarm_20261023_step29/app/ready/ps7_init.tcl"

proc mask_poll {addr mask} {
    for {set i 0} {$i < 300} {incr i} {
        if {[expr {[read32 $addr] & $mask}] == $mask} { return }
        sleep 10
    }
    echo [format "  (DDR poll 宽容: %s=0x%08x)" $addr [expr {[read32 $addr] & 0xffffffff}]]
    return
}
proc mask_delay {addr val} { sleep $val }
proc ps_version { } { return [format "0x%x" [expr {[read32 0xF8007080] >> 28}]] }
proc configparams {args} { return 1 }

init
targets zynq.cpu0
halt 5000
source $INIT
set ::PCW_SILICON_VER_1_0 $PCW_SILICON_VER_1_0
set ::PCW_SILICON_VER_2_0 $PCW_SILICON_VER_2_0
set ::PCW_SILICON_VER_3_0 $PCW_SILICON_VER_3_0
set ::APU_FREQ $APU_FREQ
ps7_init
echo "FCLK0_CTRL 读回: [format 0x%08x [expr {[read32 0xF8000170] & 0xffffffff}]]"
echo "═══ pld load + JSTART ═══"
poll off
catch {pld load zynq_pl.pld $BIT} e1
echo "pld load -> $e1"
irscan zynq_pl.bs 0x0c
runtest 4000
irscan zynq_pl.bs 0x3f
runtest 2000
poll on
sleep 200
if {[catch {set ver [read32 0x43C0003C]} err]} {
    echo "PL 版本读失败: $err"
    echo "── 退路：再试一次直接读 ──"
    catch {sleep 500; set ver [read32 0x43C0003C]} err2
    echo "二次读: $err2 / ver=$ver"
} {
    echo [format "PL_VERSION = 0x%08x %s" [expr {$ver & 0xffffffff}] [expr {($ver & 0xffffffff) == 0x000d0003 ? "✓✓✓ 成功" : "✗ 版本不符"}]]
}
shutdown

# 探针2：ps7_init(容错) 之后直接实测 DDR 读写能力
set INIT "D:/Swarm_20261023_step29/app/ready/ps7_init.tcl"

proc mask_poll {addr mask} {
    for {set i 0} {$i < 60} {incr i} {
        if {[expr {[read32 $addr] & $mask}] == $mask} { return }
        sleep 100
    }
    echo [format "  (poll 超时: %s = 0x%08x want 0x%08x)" $addr [expr {[read32 $addr] & 0xffffffff}] $mask]
    error "poll timeout $addr"
}
proc mask_delay {addr val} { sleep $val }
proc ps_version { } { return [format "0x%x" [expr {[read32 0xF8007080] >> 28}]] }
proc configparams {args} { return 1 }

init
targets zynq.cpu0
halt 5000
source $INIT
set ::PCW_SILICON_VER_1_0 $PCW_SILICON_VER_1_0
set ::PCW_SILICON_VER_2_0 $PCW_SILICON_VER_2_0
set ::PCW_SILICON_VER_3_0 $PCW_SILICON_VER_3_0
set ::APU_FREQ $APU_FREQ
if {[catch {ps7_init} err]} { echo "ps7_init 容错继续: $err" }
echo "═══ DDR 读写实测 ═══"
foreach a {0x00100000 0x01000000 0x10000000} {
    mww $a 0x12345678
    set v [expr {[read32 $a] & 0xffffffff}]
    echo [format "  DDR 0x%08x: 写 0x12345678 → 读 0x%08x %s" $a $v [expr {$v == 0x12345678 ? "✓" : "✗"}]]
}
echo "═══ 关键状态 ═══"
echo [format "  0xF8006054 = 0x%08x" [expr {[read32 0xF8006054] & 0xffffffff}]]
echo [format "  0xF8000126(DDR时钟) = 0x%08x" [expr {[read32 0xF8000126] & 0xffffffff}]]
shutdown
